# render.yaml — Deploy automático do Bot WhatsApp PreçoSmart no Render.com
# Docs: https://render.com/docs/render-yaml

services:
  - type: web
    name: precosmart-whatsapp-bot
    runtime: node
    rootDir: whatsapp-bot
    buildCommand: npm install
    startCommand: node bot.js
    plan: free
    envVars:
      - key: PORT
        value: "10000"
      - key: WA_GROUP_NAME
        value: "PreçoSmart | Ofertas & Achadinhos 🔥"
      - key: WA_GROUP_INVITE_CODE
        value: "Lo3ONNfAXVh5cEe2Pg6gM7"
      - key: WA_GROUP_JID
        value: "120363428098199018@g.us"
      - key: AFFILIATE_AMAZON
        value: "precosmartapp-20"
      - key: AFFILIATE_ML
        value: "azs5603820"
      - key: AFFILIATE_SHOPEE
        value: "18361251220"
      - key: AFFILIATE_MAGALU
        value: "precosmartvip"
      - key: AFFILIATE_AWIN
        value: "3077915"
      - key: NODE_ENV
        value: production
      - key: TELEGRAM_BOT_TOKEN
        value: "8661370793:AAFsfY6NTmzGgxZMbrQ6Gr3SNvrZoyUiaWs"
      - key: TELEGRAM_CHAT_ID
        value: "@precosmart"
    disk:
      name: whatsapp-session
      mountPath: /opt/render/project/src/session
      sizeGB: 1

  - type: web
    name: precosmart-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    plan: free

  - type: static
    name: precosmart-frontend
    buildCommand: cd frontend && npm install && npm run build
    publishDir: frontend/dist

