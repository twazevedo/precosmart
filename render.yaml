# render.yaml — Deploy automático do Bot WhatsApp PreçoSmart no Render.com
# Docs: https://render.com/docs/render-yaml
#
# ATENCAO: o bot de producao ja roda em um servico criado manualmente (precosmart-b8pg).
# Aplicar este arquivo como "Blueprint" criaria UM SEGUNDO servico precosmart-whatsapp-bot
# na mesma conta de WhatsApp (sessoes duplicadas / ofertas em dobro). Para subir so o
# backend e o frontend, crie-os manualmente (New > Web Service / Static Site) usando os
# valores abaixo, ou remova o bloco do bot antes de aplicar o Blueprint.

services:
  - type: web
    name: precosmart-whatsapp-bot
    runtime: node
    rootDir: whatsapp-bot
    buildCommand: npm install
    startCommand: node bot.js
    plan: free
    envVars:
      - key: PORT
        value: "10000"
      - key: WA_GROUP_NAME
        value: "PreçoSmart | Ofertas & Achadinhos 🔥"
      - key: WA_GROUP_INVITE_CODE
        value: "Lo3ONNfAXVh5cEe2Pg6gM7"
      - key: WA_GROUP_JID
        value: "120363428098199018@g.us"
      - key: AFFILIATE_AMAZON
        value: "precosmartapp-20"
      - key: AFFILIATE_ML
        value: "azs5603820"
      - key: AFFILIATE_SHOPEE
        value: "18361251220"
      - key: AFFILIATE_MAGALU
        value: "precosmartvip"
      - key: AFFILIATE_AWIN
        value: "3077915"
      - key: AFFILIATE_BOTICARIO
        value: "27065696"
      - key: NODE_ENV
        value: production
      - key: AWIN_API_TOKEN
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: MONGO_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: BACKEND_API_URL
        value: "https://precosmart-backend.onrender.com/api"
      - key: API_SECRET_KEY
        generateValue: true

  - type: web
    name: precosmart-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /api/stats
    plan: free
    envVars:
      - key: PORT
        value: "3001"
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: API_SECRET_KEY
        fromService:
          type: web
          name: precosmart-whatsapp-bot
          envVarKey: API_SECRET_KEY

  - type: static
    name: precosmart-frontend
    buildCommand: cd frontend && npm install && npm run build
    publishDir: frontend/dist
    routes:
      # O frontend chama /api/... (relativo); sem este rewrite o site estatico responde 404.
      - type: rewrite
        source: /api/*
        destination: https://precosmart-backend.onrender.com/api/*

