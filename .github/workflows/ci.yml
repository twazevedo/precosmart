name: 'PreçoSmart CI'

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  bot-tests:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    - name: Setup Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
    - name: Install and Test WhatsApp Bot
      run: |
        cd whatsapp-bot
        npm install
        npm test
        node --test test/security.test.js

  backend-lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    - name: Setup Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
    - name: Install and Lint Backend
      run: |
        cd backend
        npm install
        npm audit --audit-level=high || true

  frontend-build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    - name: Setup Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
    - name: Install and Build Frontend
      run: |
        cd frontend
        npm install
        npm run build
