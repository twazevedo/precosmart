version: '3.8'

services:
  # 🌐 Interface Web do Comparador (React + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: precosmart_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

  # ⚙️ API REST & Comparador de Cestas (Express + SQLite)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: precosmart_backend
    restart: always
    ports:
      - "3001:3001"
    volumes:
      - ./backend/data:/app/data
    environment:
      - PORT=3001
      - NODE_ENV=production
      - API_SECRET_KEY=${API_SECRET_KEY:-changeme}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/stats"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 🤖 Robô de Ofertas & Automação Inteligente (WhatsApp + Telegram + Instagram)
  whatsapp-bot:
    build:
      context: ./whatsapp-bot
      dockerfile: Dockerfile
    container_name: precosmart_whatsapp_bot
    restart: always
    ports:
      - "3002:3002"
    env_file:
      - ./whatsapp-bot/.env
    volumes:
      - ./whatsapp-bot/session:/app/session
      - ./whatsapp-bot/data:/app/data
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
      - TZ=America/Sao_Paulo
      - BACKEND_API_URL=http://backend:3001/api
